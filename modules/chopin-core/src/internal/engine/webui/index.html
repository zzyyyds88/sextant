<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Chopin Pilot</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <section id="loginView" class="login-view">
    <div class="login-card">
      <h1>Chopin Pilot</h1>
      <p class="muted" data-i18n="loginHint"></p>
      <label class="sr-only" for="tokenInput" data-i18n="tokenLabel"></label>
      <textarea id="tokenInput" class="token-input" rows="4" autocomplete="off" spellcheck="false"
                data-i18n-placeholder="tokenPlaceholder"></textarea>
      <button id="loginBtn" class="primary" type="button" data-i18n="login"></button>
      <p id="loginError" class="error" role="alert"></p>
    </div>
  </section>

  <section id="appView" class="app-view" hidden>
    <header class="topbar">
      <div class="brand">Chopin Pilot <span id="version" class="version"></span></div>
      <div id="statusBadge" class="badge" data-i18n="connecting"></div>
      <div class="spacer"></div>
      <select id="displaySelect" aria-label="display"></select>
      <button id="logoutBtn" class="ghost" type="button" data-i18n="logout"></button>
    </header>

    <!-- The readings a person needs before anything else: is the pipe alive, is
         the phone permitting it, and who is holding the pen. -->
    <section class="rail" aria-label="device state">
      <div class="cell">
        <span class="k" data-i18n="railDaemon"></span>
        <span class="v idle" id="dDaemon">—</span>
      </div>
      <div class="cell">
        <span class="k" data-i18n="railA11y"></span>
        <span class="v idle" id="dA11y">—</span>
      </div>
      <div class="cell">
        <span class="k" data-i18n="railBg"></span>
        <span class="v idle" id="dBg">—</span>
      </div>
      <div class="cell">
        <span class="k" data-i18n="railSessions"></span>
        <span class="v idle" id="dSessions">—</span>
      </div>
      <div class="cell">
        <span class="k" data-i18n="railUptime"></span>
        <span class="v idle" id="dUptime">—</span>
      </div>
    </section>

    <div id="banner" class="banner" hidden>
      <span id="bannerText"></span>
      <button id="retryStreamBtn" class="ghost small" type="button" data-i18n="retry"></button>
    </div>

    <main class="stage-wrap">
      <div id="stage" class="stage">
        <video id="video" autoplay muted playsinline hidden></video>
        <img id="snapshot" alt="" hidden>
        <div id="stageHint" class="stage-hint" data-i18n="stageHint"></div>
      </div>

      <!-- What the agent is doing, in the agent's own words. Same sentence the
           phone's overlay shows, so the two screens agree. -->
      <div id="activity" class="activity">
        <span class="dot"></span>
        <span id="activityWhat" class="what" data-i18n="activityIdle"></span>
        <span id="activityMeta" class="meta"></span>
      </div>
    </main>

    <section class="sessionbar">
      <div id="sessionInfo" class="session-info"></div>
      <div class="session-actions">
        <button id="claimBtn" class="primary" type="button" data-i18n="claim"></button>
        <button id="releaseBtn" class="ghost" type="button" data-i18n="release" hidden></button>
      </div>
    </section>

    <!-- Reachability. The daemon has always known its own port and the phone's
         address, and the page never said either: "how do I open this from a
         laptop" was answerable only by reading the source. -->
    <section class="access">
      <div class="access-main">
        <span class="k" data-i18n="accessLabel"></span>
        <code id="accessUrl" class="mono">—</code>
      </div>
      <div class="access-side">
        <button id="copyUrlBtn" class="ghost small" type="button" data-i18n="copyUrl"></button>
      </div>
    </section>

    <section class="inputbar">
      <div class="keyrow">
        <button class="key" type="button" data-key="KEYCODE_BACK" data-i18n="back"></button>
        <button class="key" type="button" data-key="KEYCODE_HOME" data-i18n="home"></button>
        <button class="key" type="button" data-key="KEYCODE_ENTER" data-i18n="enter"></button>
        <button class="key" type="button" data-key="KEYCODE_DEL" data-i18n="delete"></button>
      </div>
      <div class="textrow">
        <textarea id="textInput" rows="2" spellcheck="false" data-i18n-placeholder="textPlaceholder"></textarea>
        <div class="text-actions">
          <button id="sendTextBtn" class="primary" type="button" data-i18n="sendText"></button>
          <button id="clearTextBtn" class="ghost" type="button" data-i18n="clearText"></button>
        </div>
      </div>
      <p id="inputHint" class="hint"></p>
    </section>
  </section>

  <script src="/ui/i18n.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
